  line_to_neutral_v: 220.0
  frequency_hz: 60.0
  conductors: 3F+N+PE
  service_capacity_kva: 30.0
  main_breaker_a: 50
  main_breaker_poles: 4
  main_breaker_icu_ka_min: 25
  main_feeder_phase_mm2: 16
  main_feeder_neutral_mm2: 16
  main_feeder_pe_mm2: 10
  main_feeder_length_m: 12.0
  reserve_factor: 1.20
  source_state: academic_design_criterion_pending_utility_feasibility
  tableros_note: "El DWG muestra TG y TG2. El diseno de anteproyecto organiza la distribucion en TG (acometida) con subalimentadores a TDE, TDF y TD-A1. TG2 se interpreta como el tablero de distribucion del edificio administrativo (equivalente a TD-A1) por proximidad; configuracion real a confirmar en campo."

calculation:
  demand_method: CNE-U_Regla_050-210_Tabla_14_para_usos_no_residenciales_mas_EM.010_art_7
  demand_method_nota: "Grifo (uso comercial/industrial): carga basica por Tabla 14 CNE-U (25 W/m2, fd 100%) como cota minima; el diseno dimensiona por cargas reales proyectadas con factores de demanda y simultaneidad justificados (EM.010 art. 7)."
  cne_voltage_drop_branch_percent_max: 2.5
  cne_voltage_drop_total_percent_max: 4.0
  cne_voltage_drop_regla: "CNE-U Regla 050-102: alimentador y circuito derivado max 2,5% c/u; total hasta salida mas alejada max 4%."
  cne_min_conductor_regla: "CNE-U Regla 030-002: minimo 2,5 mm2 cobre en circuitos derivados de fuerza y alumbrado."
  cne_ampacity_regla: "CNE-U Regla 030-004 y Tabla 2 (XLPE/EPR 90 C, 3 conductores cargados, metodos B1/D NTP 370.301)."
  cne_pe_regla: "CNE-U Tabla 16: minima seccion de enlace equipotencial segun proteccion."
  cne_pe_minimum_note: "el PE de circuitos con motor se adopta igual a la fase (mayor que Tabla 16) por proteccion fisica y continuidad."
  copper_resistivity_ohm_mm2_per_m_at_operating_temperature: 0.021
  cable_reactance_ohm_per_km: 0.08
  minimum_power_and_lighting_conductor_mm2: 2.5
  default_derating_factor: 0.80
  derating_note: "CNE-U Tabla 5A/5C: factor 0,80 adopta conservadoramente correccion por temperatura, agrupamiento y altitud (Puno, 3830 m); no se aplican factores separados."
  phase_unbalance_target_percent: 10.0

